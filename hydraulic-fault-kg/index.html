<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="液压伺服阀故障知识图谱公开交互演示"><title>液压故障知识图谱 · 公开演示</title><style>
:root{--ink:#173047;--muted:#718396;--blue:#255b82;--green:#2f6855;--amber:#a9612d;--paper:#f3f7fa;--line:#dbe6ee;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#123958;color:#d9eaf6;padding:27px 19px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800}.brand small{display:block;margin-top:7px;color:#83b2d2;font-size:11px;font-weight:500}.nav{margin-top:30px}.nav button{display:block;width:100%;margin:6px 0;padding:12px 14px;border:0;border-radius:9px;background:transparent;color:#d9eaf6;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#2a6590}.main{padding:25px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{margin:0;font-size:26px}.badge{padding:8px 12px;border-radius:999px;background:#e7f1f7;color:var(--blue);font-size:12px}.notice{margin:17px 0;padding:12px 15px;border-left:4px solid var(--amber);background:#fff8ef;color:#715538;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:17px 0}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #1730470b}.card{padding:17px}.card b{font-size:25px;color:var(--blue)}.card span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:17px}.panel{padding:17px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800}.graph{position:relative;height:425px;overflow:hidden;border-radius:11px;background:radial-gradient(circle at center,#eaf4fa,#fff 68%)}.node{position:absolute;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;color:#fff;box-shadow:0 5px 14px #17395540;cursor:pointer;transition:.2s}.node:hover,.node.active{transform:scale(1.08);outline:5px solid #255b8222}.center{width:105px;height:105px;left:42%;top:38%;background:var(--blue);font-size:15px}.n1,.n2,.n3,.n4,.n5{width:78px;height:78px}.n1{left:8%;top:12%;background:var(--amber)}.n2{right:9%;top:12%;background:var(--green)}.n3{left:10%;bottom:12%;background:#617a25}.n4{right:9%;bottom:11%;background:#176c79}.n5{left:44%;top:3%;background:#8062a0}.graph svg{position:absolute;inset:0;width:100%;height:100%}.evidence{padding:13px;border-left:4px solid var(--blue);background:#f5f9fc;font-size:13px;line-height:1.7}.qa{display:flex;gap:8px;margin-top:14px}.qa input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px}.qa button{border:0;border-radius:9px;padding:0 14px;background:var(--blue);color:#fff;cursor:pointer}.answer{min-height:118px;margin-top:10px;padding:13px;border-radius:9px;background:#f7fafc;color:#42566a;font-size:13px;line-height:1.7}.score{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}.bar{height:6px;margin-top:5px;border-radius:6px;background:#e4ecf1;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:flex;overflow:auto;margin-top:15px}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:20px}.graph{height:350px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">液压故障知识平台<small>PORTFOLIO · PUBLIC DEMO</small></div><nav class="nav"><button>数据源管理</button><button>事件抽取</button><button class="active">知识图谱</button><button>证据问答</button><button>维修建议</button><button>质量评估</button></nav></aside><main class="main"><header class="top"><h1>故障演化知识图谱</h1><span class="badge">证据约束已开启</span></header><div class="notice">公开演示使用合成事件与脱敏文本，不连接生产数据库；维修建议必须由专业人员复核。</div><section class="cards"><div class="card"><b>126</b><span>事件节点</span></div><div class="card"><b>214</b><span>因果关系</span></div><div class="card"><b>92%</b><span>证据覆盖率</span></div><div class="card"><b>18</b><span>待人工复核</span></div></section><div class="grid"><section class="panel"><div class="head"><span>伺服阀故障链</span><small style="color:var(--muted)">点击节点查看证据</small></div><div class="graph"><svg viewBox="0 0 700 425" preserveAspectRatio="none"><g stroke="#9ab6c9" stroke-width="2"><line x1="145" y1="95" x2="335" y2="205"/><line x1="550" y1="95" x2="390" y2="205"/><line x1="145" y1="340" x2="335" y2="245"/><line x1="555" y1="340" x2="390" y2="245"/><line x1="360" y1="60" x2="360" y2="180"/></g></svg><button class="node center active" data-key="jam">阀芯卡滞</button><button class="node n1" data-key="oil">油液污染</button><button class="node n2" data-key="delay">响应迟滞</button><button class="node n3" data-key="wear">磨粒沉积</button><button class="node n4" data-key="flow">流量波动</button><button class="node n5" data-key="gap">间隙异常</button></div></section><section class="panel"><div class="head"><span>证据与机理校验</span><small style="color:var(--green)">可追溯</small></div><div id="evidence" class="evidence"></div><div class="score"><span>证据匹配</span><b>0.94</b></div><div class="bar"><i style="width:94%"></i></div><div class="score"><span>机理一致性</span><b>0.89</b></div><div class="bar"><i style="width:89%"></i></div><div class="qa"><input id="question" value="阀芯卡滞时应先检查什么？" aria-label="输入问题"><button id="ask">提问</button></div><div id="answer" class="answer">点击“提问”查看基于当前子图和证据的受约束回答。</div></section></div></main></div><script>
const facts={jam:['阀芯卡滞','油液污染与配合间隙异常会提高摩擦阻力，导致阀芯动作受阻。','公开维修案例 A-07'],oil:['油液污染','污染颗粒进入配合间隙后可能形成磨粒沉积。','公开手册片段 M-12'],delay:['响应迟滞','阀芯动作受阻会使阀口建立时间延长。','合成试验记录 S-03'],wear:['磨粒沉积','沉积与磨损会改变局部配合状态，应结合油样与拆检确认。','公开案例 A-11'],flow:['流量波动','阀口开度不稳定可能表现为输出流量波动。','公开教材片段 T-06'],gap:['间隙异常','间隙变化需结合温度、污染度和零件磨损共同判断。','机理模板 T3']};function show(key){document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.key===key));const f=facts[key];document.querySelector('#evidence').innerHTML='<b>事件：'+f[0]+'</b><br>证据：'+f[1]+'<br><span style="color:#718396">来源：'+f[2]+'</span>'}document.querySelectorAll('.node').forEach(n=>n.onclick=()=>show(n.dataset.key));document.querySelector('#ask').onclick=()=>{const q=document.querySelector('#question').value.trim();document.querySelector('#answer').innerHTML=q?'<b>建议先检查油液清洁度、滤芯压差和阀芯动作阻力。</b><br>依据当前子图，污染与间隙异常均可能触发卡滞；确认现场证据后再决定是否拆检。<br><span style="color:#a9612d">边界：辅助决策，不替代专业诊断。</span>':'请输入问题。'};show('jam');
</script></body></html>
