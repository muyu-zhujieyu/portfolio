<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c5f8a"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="spoolGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
  </defs>

  <!-- 阀体 -->
  <rect x="40" y="100" width="400" height="120" rx="18" fill="url(#bodyGrad)" stroke="#0d2136" stroke-width="3"/>
  <rect x="60" y="80" width="360" height="160" rx="12" fill="none" stroke="#406080" stroke-width="2"/>

  <!-- 阀芯（中间可动） -->
  <rect x="160" y="120" width="160" height="80" rx="10" fill="url(#spoolGrad)" stroke="#600000" stroke-width="2"/>
  <!-- 阀芯台阶 -->
  <rect x="170" y="115" width="30" height="90" rx="5" fill="#E74C3C" stroke="#600000" stroke-width="1.5"/>
  <rect x="280" y="115" width="30" height="90" rx="5" fill="#E74C3C" stroke="#600000" stroke-width="1.5"/>
  <rect x="200" y="125" width="80" height="70" rx="6" fill="#c41e3a" stroke="#600000" stroke-width="1"/>

  <!-- 左侧喷嘴挡板 -->
  <rect x="100" y="140" width="50" height="16" rx="3" fill="#409EFF" stroke="#1a3a5c" stroke-width="1.5"/>
  <rect x="105" y="145" width="8" height="6" rx="2" fill="#1a3a5c"/>
  <text x="125" y="152" font-size="11" fill="white" font-family="sans-serif" text-anchor="middle">喷嘴</text>

  <!-- 右侧喷嘴挡板 -->
  <rect x="330" y="140" width="50" height="16" rx="3" fill="#409EFF" stroke="#1a3a5c" stroke-width="1.5"/>
  <rect x="365" y="145" width="8" height="6" rx="2" fill="#1a3a5c"/>
  <text x="355" y="152" font-size="11" fill="white" font-family="sans-serif" text-anchor="middle">挡板</text>

  <!-- 力矩马达（顶部） -->
  <rect x="180" y="55" width="120" height="30" rx="6" fill="#F39C12" stroke="#8B6914" stroke-width="2"/>
  <text x="240" y="75" font-size="13" fill="white" font-family="sans-serif" font-weight="bold" text-anchor="middle">力矩马达</text>
  <!-- 线圈 -->
  <circle cx="210" cy="70" r="8" fill="none" stroke="#E67E22" stroke-width="2.5"/>
  <circle cx="270" cy="70" r="8" fill="none" stroke="#E67E22" stroke-width="2.5"/>

  <!-- 反馈杆 -->
  <line x1="240" y1="85" x2="240" y2="115" stroke="#95A5A6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="118" r="4" fill="#7F8C8D"/>

  <!-- 气隙垫片 -->
  <rect x="215" y="88" width="10" height="8" rx="2" fill="#E74C3C" stroke="#8B0000" stroke-width="1"/>
  <rect x="255" y="88" width="10" height="8" rx="2" fill="#E74C3C" stroke="#8B0000" stroke-width="1"/>
  <text x="240" y="83" font-size="9" fill="#F39C12" font-family="sans-serif" text-anchor="middle">垫片</text>

  <!-- P/T/A/B 油口标注 -->
  <text x="80" y="95" font-size="14" fill="#F39C12" font-family="sans-serif" font-weight="bold">P (供油)</text>
  <text x="370" y="95" font-size="14" fill="#2ECC71" font-family="sans-serif" font-weight="bold">T (回油)</text>
  <text x="140" y="240" font-size="14" fill="#409EFF" font-family="sans-serif" font-weight="bold">A (工作口)</text>
  <text x="300" y="240" font-size="14" fill="#409EFF" font-family="sans-serif" font-weight="bold">B (工作口)</text>

  <!-- 油口箭头 -->
  <polygon points="70,108 60,118 80,118" fill="#F39C12"/>
  <polygon points="410,108 400,118 420,118" fill="#2ECC71"/>
  <polygon points="180,225 170,215 190,215" fill="#409EFF"/>
  <polygon points="320,225 310,215 330,215" fill="#409EFF"/>

  <!-- 标签 -->
  <text x="240" y="275" font-size="16" fill="#1a3a5c" font-family="sans-serif" font-weight="bold" text-anchor="middle">液压伺服阀结构示意图</text>
  <text x="240" y="298" font-size="12" fill="#909399" font-family="sans-serif" text-anchor="middle">力矩马达 + 喷嘴挡板 + 滑阀 + 反馈杆</text>
</svg>
