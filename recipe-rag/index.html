<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="尝尝咸淡 Recipe RAG 浏览器交互演示"><title>尝尝咸淡 · Recipe RAG Demo</title><style>
:root{--ink:#2c251f;--muted:#786c61;--paper:#f8f3eb;--amber:#a9612d;--line:#e6d9ca;--card:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif}.shell{width:min(1120px,calc(100% - 32px));margin:auto}header{padding:55px 0 28px}.eyebrow{color:var(--amber);font-weight:800;letter-spacing:.12em;font-size:12px}h1{margin:8px 0;font-size:clamp(34px,6vw,62px)}.lead{max-width:760px;color:var(--muted);line-height:1.75}.notice{padding:12px 15px;border:1px solid #ead7bd;border-radius:10px;background:#fff7e9;color:#745738;font-size:13px}.workspace{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin:20px 0 50px}.panel{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 12px 35px #5a3b2010}.panel h2{margin:0 0 16px;font-size:19px}.examples{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}.examples button{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);cursor:pointer}.query{display:flex;gap:9px}.query textarea{flex:1;min-height:90px;padding:13px;border:1px solid var(--line);border-radius:12px;resize:vertical;font:inherit}.query button{width:88px;border:0;border-radius:12px;background:var(--amber);color:#fff;font-weight:800;cursor:pointer}.steps{display:grid;gap:9px;margin-top:17px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px;border-radius:11px;background:#f5eee5}.step b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ead8c4;color:var(--amber)}.step span{font-size:13px;line-height:1.5}.step small{display:block;color:var(--muted)}.answer{min-height:420px;padding:19px;border-radius:14px;background:#25211f;color:#eee7df;line-height:1.75}.answer .route{display:inline-block;margin-bottom:12px;padding:4px 8px;border-radius:6px;background:#46392f;color:#f4c48f;font-size:12px}.answer h3{color:#f4c48f}.source{margin-top:16px;padding-top:12px;border-top:1px solid #50463e;color:#bcb0a5;font-size:12px}.empty{display:grid;place-items:center;height:330px;color:#998d82;text-align:center}@media(max-width:800px){.workspace{grid-template-columns:1fr}.query{flex-direction:column}.query button{width:100%;height:45px}.answer{min-height:300px}}
</style></head><body><header class="shell"><div class="eyebrow">RECIPE RAG · PUBLIC DEMO</div><h1>尝尝咸淡</h1><p class="lead">用标题感知分块、向量与 BM25 混合召回、RRF 融合和查询路由，为中文家常菜问题生成有来源的回答。</p><div class="notice">此页面使用 6 份自编演示菜谱在浏览器内模拟检索流程，不调用外部模型，也不需要密钥。</div></header><main class="shell workspace"><section class="panel"><h2>输入你的菜谱问题</h2><div class="examples"><button>推荐两道简单清淡的早餐</button><button>番茄炒蛋需要什么食材</button><button>鸡蛋三明治怎么做</button></div><div class="query"><textarea id="q" aria-label="菜谱问题">推荐两道简单清淡的早餐</textarea><button id="run">开始检索</button></div><div class="steps"><div class="step"><b>1</b><span>查询路由<small id="route">等待分析意图</small></span></div><div class="step"><b>2</b><span>混合召回<small id="retrieve">向量 + BM25，RRF 融合</small></span></div><div class="step"><b>3</b><span>父文档回溯<small id="parent">保留完整食材和步骤</small></span></div></div></section><section class="panel"><h2>有依据的回答</h2><div id="answer" class="answer"><div class="empty">输入问题后开始检索<br>回答会显示路由和来源</div></div></section></main><script>
const samples={list:{route:'列表推荐',html:'<span class="route">intent: list · 早餐 · 清淡 · 简单</span><h3>① 燕麦香蕉杯</h3><p>食材少、无需复杂烹饪；燕麦与香蕉口味温和，适合快速早餐。</p><h3>② 鸡蛋蔬菜三明治</h3><p>步骤短，可少油制作；鸡蛋和生菜提供基础营养。</p><div class="source">来源：早餐/燕麦香蕉杯.md；早餐/鸡蛋蔬菜三明治.md</div>'},ingredient:{route:'食材查询',html:'<span class="route">intent: basic_info · 番茄炒蛋</span><h3>番茄炒蛋 · 食材</h3><p>番茄 2 个、鸡蛋 3 个、盐适量、食用油少量。可根据口味加入葱花。</p><p>回答只复述演示菜谱中的食材字段，没有补充未检索到的用量。</p><div class="source">来源：家常菜/番茄炒蛋.md</div>'},detail:{route:'详细做法',html:'<span class="route">intent: detail · 鸡蛋三明治</span><h3>鸡蛋蔬菜三明治</h3><p>1. 鸡蛋煮熟后压碎。<br>2. 生菜洗净沥干。<br>3. 将鸡蛋和生菜夹入面包片，可按口味少量调味。</p><div class="source">来源：早餐/鸡蛋蔬菜三明治.md</div>'}};function run(){const q=document.querySelector('#q').value;const key=/食材|需要什么/.test(q)?'ingredient':/怎么|步骤|做法/.test(q)?'detail':'list';const s=samples[key];document.querySelector('#route').textContent='已识别：'+s.route;document.querySelector('#retrieve').textContent='向量 top-6 + BM25 top-6 → 命中 2 个子块';document.querySelector('#parent').textContent='已回溯完整父文档，保留结构';document.querySelector('#answer').innerHTML=s.html}document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{document.querySelector('#q').value=b.textContent;run()});document.querySelector('#run').onclick=run;run();
</script></body></html>
